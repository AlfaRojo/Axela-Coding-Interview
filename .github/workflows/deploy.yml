name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; no cancela el que ya esta corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El repo usa pnpm (pnpm-lock.yaml, sin package-lock.json): npm ci fallaria.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Sin `cache: pnpm`: setup-node resuelve el store con `pnpm store path` y
      # falla si todavia no existe en el runner. El install de este proyecto es
      # corto, no vale la pena el riesgo.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install --frozen-lockfile

      # CI=true hace que react-scripts trate los warnings como errores.
      - run: pnpm build
        env:
          CI: false

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
